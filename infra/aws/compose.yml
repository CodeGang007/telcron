# The application stack on the AWS dev host: reverse proxy with automatic HTTPS, API, Worker, Redis.
# PostgreSQL is RDS, not a container. Started by infra/aws/deploy-host.sh, which writes the env file.
name: telcron-app

x-backend: &backend
  image: ${BACKEND_IMAGE}
  restart: unless-stopped
  env_file: ${TELCRON_ENV_FILE:-/opt/telcron/.env}
  depends_on:
    redis:
      condition: service_healthy

services:
  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      API_HOST: ${API_HOST}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data          # certificates: keep them, issuance is rate-limited
      - caddy_config:/config
    depends_on:
      - api

  api:
    <<: *backend
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  worker:
    <<: *backend
    command: ["python", "-m", "app.workers.main"]

  # Job queues and the passport cache. `noeviction`: a full Redis must refuse writes, not drop jobs.
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "96mb", "--maxmemory-policy", "noeviction"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  caddy_data:
  caddy_config:
  redis_data:
